<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}{% endblock %} · Sistema Médico General</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
  <div class="pantalla-acceso">
    <div class="caja-acceso">
      <div class="logo">✚ Sistema Médico General</div>
      {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% for categoria, texto in mensajes %}
          <div class="mensaje {{ categoria }}">{{ texto }}</div>
        {% endfor %}
      {% endwith %}
      {% block contenido %}{% endblock %}
    </div>
  </div>
</body>
</html>
