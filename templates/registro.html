{% extends "base_acceso.html" %}
{% block titulo %}Registro{% endblock %}
{% block contenido %}
<h1>Crear cuenta</h1>
<p class="subtitulo">Registra tu acceso al sistema</p>
<form method="post">
  <div class="campo">
    <label for="nombre">Nombre completo</label>
    <input id="nombre" name="nombre" required>
  </div>
  <div class="campo">
    <label for="correo">Correo electrónico</label>
    <input type="email" id="correo" name="correo" required>
  </div>
  <div class="campo">
    <label for="rol">Rol</label>
    <select id="rol" name="rol">
      <option>Médico</option>
      <option>Recepción</option>
      <option>Administrador</option>
    </select>
  </div>
  <div class="fila">
    <div class="campo">
      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" name="contrasena" required>
    </div>
    <div class="campo">
      <label for="confirmar">Confirmar</label>
      <input type="password" id="confirmar" name="confirmar" required>
    </div>
  </div>
  <button class="boton ancho" type="submit">Crear cuenta</button>
</form>
<p class="pie-acceso">¿Ya tienes cuenta? <a href="{{ url_for('iniciar_sesion') }}">Inicia sesión</a></p>
{% endblock %}
