{% extends "navbar_footer.html" %}
{% block titulo %}Nueva consulta{% endblock %}
{% block contenido %}
<div class="encabezado">
  <div>
    <h1>Nueva consulta</h1>
    <p>Registra signos vitales, diagnóstico y notas clínicas</p>
  </div>
</div>

<form method="post">
  <div class="tarjeta">
    <h2>Paciente y médico</h2>
    <div class="fila">
      <div class="campo">
        <label for="paciente_id">Paciente</label>
        <select id="paciente_id" name="paciente_id" required>
          {% for p in pacientes %}<option value="{{ p.id }}" {{ 'selected' if p.id == seleccionado }}>{{ p.nombre }}</option>{% endfor %}
        </select>
      </div>
      <div class="campo">
        <label for="medico">Médico</label>
        <select id="medico" name="medico">
          {% for m in medicos %}<option>{{ m.nombre }}</option>{% endfor %}
        </select>
      </div>
    </div>
  </div>

  <div class="tarjeta">
    <h2>Signos vitales</h2>
    <div class="fila">
      <div class="campo"><label for="presion">Presión arterial</label><input id="presion" name="presion" placeholder="120/80"></div>
      <div class="campo"><label for="temperatura">Temperatura (°C)</label><input id="temperatura" name="temperatura" type="number" step="0.1"></div>
      <div class="campo"><label for="peso">Peso (kg)</label><input id="peso" name="peso" type="number" step="0.1"></div>
      <div class="campo"><label for="frecuencia">Frec. cardiaca (lpm)</label><input id="frecuencia" name="frecuencia" type="number"></div>
    </div>
  </div>

  <div class="tarjeta">
    <h2>Evaluación</h2>
    <div class="campo">
      <label for="sintomas">Síntomas</label>
      <textarea id="sintomas" name="sintomas" rows="3"></textarea>
    </div>
    <div class="campo">
      <label for="diagnostico">Diagnóstico</label>
      <input id="diagnostico" name="diagnostico" required>
    </div>
    <div class="campo">
      <label for="notas">Notas y tratamiento</label>
      <textarea id="notas" name="notas" rows="4"></textarea>
    </div>
    <div class="acciones">
      <a class="boton secundario" href="{{ url_for('panel') }}">Cancelar</a>
      <button class="boton" type="submit">Guardar consulta</button>
    </div>
  </div>
</form>
{% endblock %}
